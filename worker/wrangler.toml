name = "the-room-backend"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [
  { name = "PRESENCE_ROOM", class_name = "PresenceRoom" }
]

[[migrations]]
tag = "v1"
new_classes = ["PresenceRoom"]

# Optional Cloudflare D1 Database binding:
# Run: npx wrangler d1 create the-room-db
# Then uncomment and fill in database_id below:
# [[d1_databases]]
# binding = "DB"
# database_name = "the-room-db"
# database_id = "<your-d1-database-uuid>"
